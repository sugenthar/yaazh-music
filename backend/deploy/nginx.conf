# nginx reverse proxy for the Yaazh Music backend.
#
# Terminates TLS (or plain HTTP in staging), load-balances across N stateless
# API instances, and preserves the real client IP for distributed rate limiting
# (/ready, /health, /api/metrics are forwarded; every instance is stateless and
# safe to scale horizontally).
#
# Place this in /etc/nginx/conf.d/yaazh-backend.conf (or sites-available) and
# ensure the app is started with TRUST_PROXY=true, TRUST_PROXY_HOP_COUNT=1.

upstream yaazh_api {
    # Stateless API instances behind this proxy. The backend DB (SQLite) is
    # per-instance today; for a shared database mount the SQLite file on shared
    # storage or migrate to a serverless/network database (see README notes).
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name api.yaazh.example;   # replace with your domain (or use listen 8080)

    # Strict transport security is configured at the TLS terminator; keep this
    # server block for HTTP->HTTPS redirect or plain HTTP staging.
    location / {
        proxy_pass http://yaazh_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

